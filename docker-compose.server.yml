# The full stack for a shared self-hosted box: the app itself plus the database
# and embedding server it depends on. docker-compose.yml cannot be used as-is
# there — it binds 5432 and 5050, and on that host both are already taken.
#
# Every published port here is offset onto a free one, under this file's own
# volumes and network. It does not touch any existing container.
#
# pgvector/pgvector:pg16 is required, not a preference — migrations/init.sql
# runs CREATE EXTENSION vector and the schema uses vector() columns, neither of
# which a stock postgres image can do.
#
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.server.yml up -d
#
# To let jobs on a containerised act_runner reach it by name:
#
#   docker network connect nimbrosa gitea-runner
#
# Pinned so the volume and network names do not depend on the checkout
# directory name.
name: nimbrosa

services:
  # The application: compiled backend plus the built SPA, one port, one process.
  #
  # Configuration comes entirely from .env (the same file the APP_ENV secret
  # writes out in CI), so nothing is duplicated here. Two values in that file
  # must differ from a laptop's, because they are resolved from inside this
  # container and not from the host:
  #
  #   DATABASE_URL=postgres://<user>:<pass>@db:5432/nimbrosa
  #     — "db" and port 5432, the service name and in-network port. The host's
  #       5433 mapping below is for psql from the box itself, not for this app.
  #
  #   EMBEDDING_BASE_URL  — leave unset to use OpenRouter. It CANNOT be pointed
  #     at the embeddings service below: src/http.ts permits http:// only for
  #     localhost, and "http://embeddings/v1" is neither localhost nor https.
  #     Using the self-hosted embedder from in here needs that check widened.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nimbrosa-app:latest
    container_name: nimbrosa-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Fixed inside the container; remap on the host with APP_HOST_PORT
      # instead. Set last so a stale PORT in .env cannot desync it from the
      # port mapping and the healthcheck below.
      PORT: 4040
    ports:
      - "${APP_HOST_PORT:-4040}:4040"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget, already in node:22-alpine — no extra layer for curl.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4040/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot compiles nothing but does open the pg-boss connection.
      start_period: 20s

  db:
    image: pgvector/pgvector:pg16
    container_name: nimbrosa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbrosa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
      POSTGRES_DB: ${POSTGRES_DB:-nimbrosa}
    ports:
      # host:container — 5432 on the host belongs to the existing postgres-db.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - nimbrosa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbrosa} -d ${POSTGRES_DB:-nimbrosa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted embeddings. Serves an OpenAI-compatible POST /v1/embeddings,
  # which is exactly what src/embedding-client.ts calls, so it needs no adapter.
  #
  # BAAI/bge-large-en-v1.5 outputs 1024 dimensions -> EMBEDDING_DIMENSIONS=1024.
  # That value sets the pgvector column width at migration time, so it must be
  # right before `npm run migrate` runs; changing it later means a new migration.
  #
  # Chat completions are NOT provided here — TEI does embeddings only. The
  # structuring LLM (OPENROUTER_MODEL) still needs OpenRouter or another
  # OpenAI-compatible chat endpoint.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: nimbrosa-embeddings
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}"]
    ports:
      # 8080 on the host belongs to heimdall.
      - "${EMBEDDINGS_HOST_PORT:-8087}:80"
    volumes:
      # Cache the weights so a restart does not re-download them.
      - nimbrosa-embeddings-data:/data

volumes:
  nimbrosa-pgdata:
  nimbrosa-embeddings-data:

networks:
  default:
    name: nimbrosa
